# Push deploy: run this from the control node, which needs ansible, SSH to every
# target, and a checkout of this repo. Targets need none of those.
#
# agent_host          selects hosts/<name>/CLAUDE.local.md. It is an inventory
#                     alias, not a hostname; a box whose real hostname differs
#                     does not need renaming.
# agent_memory_source optional. Absolute path on the TARGET to a live runtime
#                     memory file. Where set, the rules directory links to it
#                     instead of holding a stale copy. Omit on hosts with no
#                     runtime memory and the rule is removed.

[agent_hosts]
dev       ansible_host=dev.example        agent_host=dev       agent_memory_source=/home/USER/.hermes/memories/MEMORY.md
behemoth  ansible_host=behemoth.example   agent_host=behemoth
work      ansible_host=work.example       agent_host=work
