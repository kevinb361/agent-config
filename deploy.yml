---
# Deploy the agent configuration profile to a box.
#
#   ansible-playbook -i inventory.ini deploy.yml --check --diff
#   ansible-playbook -i inventory.ini deploy.yml --limit dev
#
# Model: PUSH. The control node holds the repo; targets never clone and never pull.
# Every deployed path is a real file, not a symlink, with one deliberate exception:
# the runtime memory rule, annotated at the task that links it. One further path,
# ~/.agent-profile/MEMORY.md, is not deployed at all -- stubbed when absent and
# otherwise left alone, so a host that links it to a live source keeps that link.
# A `git pull` on a target does not update its live profile, and a hand-edit to a
# deployed file is overwritten by the next run. Running this playbook in --check
# --diff mode is therefore also the drift detector.
#
# Push rather than pull because at least one target cannot resolve the internal Git
# host, has no ansible, and its home is not a Git repository.
#
# Real files rather than symlinks because desktop sessions skip a user rules
# directory that is itself a symlink, or a rule file pointing outside the working
# directory.

- name: Deploy agent configuration profile
  hosts: agent_hosts
  gather_facts: true

  vars:
    agent_profile_dir: "{{ ansible_env.HOME }}/.agent-profile"
    agent_private_dir: "{{ ansible_env.HOME }}/private"
    agent_rules_dir: "{{ ansible_env.HOME }}/.claude/rules"
    agent_backup_dir: "{{ ansible_env.HOME }}/.claude/backups"
    agent_host_key: "{{ agent_host | default(inventory_hostname_short) }}"
    # Host overlays name real infrastructure, so they live in the private sibling
    # repo rather than this one. Clone both side by side on the control node.
    agent_overlay_root: "{{ playbook_dir }}/../agent-config-private/hosts"
    agent_remove_home_claude_md: true

    # Files this play owns inside ~/.agent-profile/. Anything else in that directory
    # is unmanaged and must survive: dev keeps private analysis files there.
    agent_shared_profile_files:
      - SOUL.md
      - USER.md
      - DESIGN.md
      - README.md
    agent_adapter_files:
      - CLAUDE.md
      - CODEX.md
      - HERMES.md

    # Global instruction paths for the other harnesses on this box, each verified
    # against that harness's own documentation on 2026-09-15. None of them read
    # ~/.claude/rules/, so without this they get the profile only when the cwd
    # happens to sit under $HOME -- the exact dependence the rules directory
    # exists to remove. opencode is worse than that: its documented fallback is
    # ~/.claude/CLAUDE.md, which this play deletes, so it ends up with nothing.
    #
    #   pi 0.85.1   ~/.pi/agent/AGENTS.md          (also walks parents from cwd)
    #   opencode    ~/.config/opencode/AGENTS.md   (else ~/.claude/CLAUDE.md)
    #
    # A host without the directory gets no file; nothing is created speculatively.
    #
    # Codex is deliberately not in this list. Its ~/.codex/AGENTS.md is generated
    # by tools/sync-agent-profile, which assembles a richer bundle than this one:
    # it runs on the target and can reach the host-local USER.local.md and
    # MEMORY.md that the control node cannot read. Writing this bundle there
    # would lose content.
    agent_harness_dirs:
      - .pi/agent
      - .config/opencode

    # Skills this play owns. DESIGN.md content lives here rather than in a rules
    # file: it is only relevant to UI work, so loading it in every session was a
    # per-session cost paid for nothing.
    agent_skills:
      - design-baseline

    # Rules files this play owns, as {name, src}. The numeric prefixes group these
    # for humans; they do NOT set load order. Measured on Claude Code 2.1.273 with
    # the InstructionsLoaded hook, the user rules directory loads its files in no
    # stable order -- four runs on one host gave four different orders. Anything
    # that depends on precedence has to say so in the text of the file itself.
    agent_rules:
      - { name: 00-soul.md,          src: profile/SOUL.md }
      - { name: 01-user.md,          src: profile/USER.md }
      - { name: 10-agreement.md,     src: CLAUDE.md }
      - { name: 11-adapter-claude.md, src: profile/adapters/CLAUDE.md }

    # Rules files from the previous hand-maintained layout. These are REMOVED.
    # Without this the old and new sets both load and every rule applies twice.
    # Enumerated on purpose: never glob the rules directory, it is not all ours.
    agent_legacy_rules:
      - 00-kevin-soul.md
      - 01-kevin-user.md
      - 02-kevin-claude-adapter.md
      - 03-kevin-memory.md
      - 04-kevin-design.md

    # DESIGN.md is deliberately NOT a rules file. It is ~240 lines relevant only to
    # UI work and belongs in a skill or a path-scoped rule, not in every session.
    # It is still deployed into ~/.agent-profile/ so the path stays resolvable.

  tasks:
    - name: Record a deploy timestamp shared by every backup path
      ansible.builtin.set_fact:
        agent_backup_stamp: "{{ ansible_date_time.iso8601_basic_short }}"

    # ---------------------------------------------------------------- backup ---
    # Repo-side staging is not a rollback. Capture what is on the host, on the
    # host, before anything is overwritten.

    - name: Create this run's backup directory
      ansible.builtin.file:
        path: "{{ agent_backup_dir }}/agent-config-{{ agent_backup_stamp }}"
        state: directory
        mode: "0700"

    - name: Find existing agent files worth preserving
      ansible.builtin.find:
        paths:
          - "{{ agent_rules_dir }}"
          - "{{ agent_profile_dir }}"
        patterns: "*.md"
        file_type: any
        recurse: true
      register: agent_existing_files

    - name: Create backup subdirectories
      ansible.builtin.file:
        path: >-
          {{ agent_backup_dir }}/agent-config-{{ agent_backup_stamp }}/{{
          item.path | relpath(ansible_env.HOME) | dirname }}
        state: directory
        mode: "0700"
      loop: "{{ agent_existing_files.files }}"
      loop_control:
        label: "{{ item.path | relpath(ansible_env.HOME) | dirname }}"
      when: not ansible_check_mode

    - name: Note that check mode does not write backups
      ansible.builtin.debug:
        msg: >-
          check mode: skipping the backup of {{ agent_existing_files.files | length }}
          existing files. A real run writes them to
          {{ agent_backup_dir }}/agent-config-<stamp>/ before anything is overwritten.
      when: ansible_check_mode

    - name: Back up the existing home agreement
      ansible.builtin.copy:
        src: "{{ ansible_env.HOME }}/{{ item }}"
        dest: "{{ agent_backup_dir }}/agent-config-{{ agent_backup_stamp }}/{{ item }}"
        remote_src: true
        mode: "0600"
      loop:
        - CLAUDE.md
        - AGENTS.md
        - .claude/CLAUDE.md
      failed_when: false
      when: not ansible_check_mode

    - name: Back up existing rules and profile files
      ansible.builtin.copy:
        src: "{{ item.path }}"
        dest: >-
          {{ agent_backup_dir }}/agent-config-{{ agent_backup_stamp }}/{{
          item.path | relpath(ansible_env.HOME) }}
        remote_src: true
        mode: "0600"
      loop: "{{ agent_existing_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      when: not ansible_check_mode

    # ------------------------------------------------------------ guard rails ---

    - name: Inspect the runtime memory path
      ansible.builtin.stat:
        path: "{{ agent_profile_dir }}/MEMORY.md"
      register: agent_memory_stat

    - name: Refuse to run when runtime memory is a dangling symlink
      ansible.builtin.fail:
        msg: >-
          {{ agent_profile_dir }}/MEMORY.md is a symlink whose target does not exist.
          copy(force=false) skips a dest that exists, but a dangling link fails the
          stat and would be replaced with a stub, costing this host its live memory
          source. Repair the link before deploying.
      when:
        - agent_memory_stat.stat.islnk | default(false)
        - not (agent_memory_stat.stat.lnk_target is defined and agent_memory_stat.stat.exists)

    # --------------------------------------------------------------- layout ---

    - name: Ensure directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        mode: "{{ item.mode }}"
      loop:
        - { path: "{{ ansible_env.HOME }}/.claude", mode: "0755" }
        - { path: "{{ agent_rules_dir }}", mode: "0755" }
        - { path: "{{ agent_profile_dir }}", mode: "0750" }
        - { path: "{{ agent_profile_dir }}/adapters", mode: "0750" }
        - { path: "{{ agent_private_dir }}", mode: "0700" }
      loop_control:
        label: "{{ item.path }}"

    # ---------------------------------------------------------- host-local ---
    # Never tracked, never overwritten. Created empty so a fresh checkout on a new
    # box resolves cleanly instead of failing on a missing file.
    #
    # force: false is what makes these stubs rather than deploys. MEMORY.md in
    # particular is a symlink to a live memory source on some hosts; skipping an
    # existing dest is what preserves that link. The dangling-symlink guard above
    # covers the one case where the stat lies about it.

    - name: Create host-local runtime memory if absent
      ansible.builtin.copy:
        content: "# Runtime Memory\n"
        dest: "{{ agent_profile_dir }}/MEMORY.md"
        force: false
        mode: "0640"

    - name: Create host-local personal context if absent
      ansible.builtin.copy:
        content: |
          # Personal Context

          Private, host-local, never tracked in agent-config.
          The playbook creates this file when absent and never overwrites it.
        dest: "{{ agent_private_dir }}/USER.local.md"
        force: false
        mode: "0600"

    # ----------------------------------------------------------- profile dir ---

    - name: Deploy shared profile files
      ansible.builtin.copy:
        src: "profile/{{ item }}"
        dest: "{{ agent_profile_dir }}/{{ item }}"
        mode: "0640"
      loop: "{{ agent_shared_profile_files }}"

    # The agreement lives at the repo root but belongs in the profile directory on
    # the target: ~/.agent-profile/ is what non-Claude tooling reads, and a profile
    # missing the working agreement is style and facts with no rules attached.
    - name: Deploy the shared agreement into the profile directory
      ansible.builtin.copy:
        src: CLAUDE.md
        dest: "{{ agent_profile_dir }}/AGREEMENT.md"
        mode: "0640"

    - name: Deploy harness adapters
      ansible.builtin.copy:
        src: "profile/adapters/{{ item }}"
        dest: "{{ agent_profile_dir }}/adapters/{{ item }}"
        mode: "0640"
      loop: "{{ agent_adapter_files }}"

    # ------------------------------------------------------------ rules dir ---

    - name: Remove rules files from the previous hand-maintained layout
      ansible.builtin.file:
        path: "{{ agent_rules_dir }}/{{ item }}"
        state: absent
      loop: "{{ agent_legacy_rules }}"

    - name: Deploy rules files
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ agent_rules_dir }}/{{ item.name }}"
        mode: "0640"
      loop: "{{ agent_rules }}"
      loop_control:
        label: "{{ item.name }}"

    # The stub above creates this file on a real run, but check mode does not write,
    # so on a host that has never been deployed to the source does not exist yet.
    # Without this guard --check fails on every fresh host, which would make the
    # dry run useless as a drift detector -- the thing it is relied on for.
    - name: Check whether host-local personal context is present yet
      ansible.builtin.stat:
        path: "{{ agent_private_dir }}/USER.local.md"
      register: agent_user_local

    - name: Deploy host-local personal context as a rule
      ansible.builtin.copy:
        src: "{{ agent_private_dir }}/USER.local.md"
        dest: "{{ agent_rules_dir }}/02-user-local.md"
        remote_src: true
        mode: "0600"
      when: agent_user_local.stat.exists or not ansible_check_mode

    # Exception to the real-files rule. Runtime memory changes while sessions run,
    # so a copy would be a stale snapshot the moment it lands. Where a host declares
    # a live memory source, link to it; elsewhere this rule simply does not exist.
    # Cost: a desktop session that skips symlinked rules will not see memory. CLI does.
    - name: Link runtime memory into the rules directory
      ansible.builtin.file:
        src: "{{ agent_memory_source }}"
        dest: "{{ agent_rules_dir }}/03-memory.md"
        state: link
        force: true
      when: agent_memory_source is defined

    - name: Remove the memory rule where no live source is declared
      ansible.builtin.file:
        path: "{{ agent_rules_dir }}/03-memory.md"
        state: absent
      when: agent_memory_source is not defined

    # ---------------------------------------------------------------- skills ---

    - name: Ensure skill directories exist
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.claude/skills/{{ item }}"
        state: directory
        mode: "0755"
      loop: "{{ agent_skills }}"

    - name: Deploy skills
      ansible.builtin.copy:
        src: "skills/{{ item }}/SKILL.md"
        dest: "{{ ansible_env.HOME }}/.claude/skills/{{ item }}/SKILL.md"
        mode: "0644"
      loop: "{{ agent_skills }}"

    # -------------------------------------------------------- host overlay ---

    - name: Look for a host overlay
      ansible.builtin.stat:
        path: "{{ agent_overlay_root }}/{{ agent_host_key }}/CLAUDE.local.md"
      delegate_to: localhost
      become: false
      register: agent_host_overlay

    - name: Deploy the host overlay
      ansible.builtin.copy:
        src: "{{ agent_overlay_root }}/{{ agent_host_key }}/CLAUDE.local.md"
        dest: "{{ agent_rules_dir }}/20-host.md"
        mode: "0640"
      when: agent_host_overlay.stat.exists

    - name: Fail when a host has no overlay
      ansible.builtin.fail:
        msg: >-
          No {{ agent_overlay_root }}/{{ agent_host_key }}/CLAUDE.local.md. Every host needs
          an overlay, if only to state what is not available on it; silently shipping
          the common layer alone is how a box ends up with guidance for tooling it
          does not have.
      when: not agent_host_overlay.stat.exists

    # --------------------------------------------------- retire the old layer ---
    # The agreement is a rules file now. A leftover ~/CLAUDE.md would load on top of
    # it for any work started under the home directory -- the same double-load the
    # legacy rules removal prevents. Backed up above before removal.
    #
    # On a host where ~/CLAUDE.md is a symlink into a project repo, this removes the
    # link only. The project's own CLAUDE.md is a correct project file wired to the
    # wrong layer, and stays exactly where it is.

    - name: Remove the superseded home agreement
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/CLAUDE.md"
        state: absent
      when: agent_remove_home_claude_md | bool

    # Same reasoning, one layer up. A user-scope ~/.claude/CLAUDE.md loads in every
    # session alongside the rules directory. The one this replaced documented the
    # old rules filenames, so after a deploy it is not merely redundant, it is
    # actively wrong. Genuinely host-local content, such as skill registrations,
    # belongs in that host's overlay.
    - name: Remove the superseded user-scope agreement
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.claude/CLAUDE.md"
        state: absent
      when: agent_remove_home_claude_md | bool

    # ----------------------------------------------- non-Claude harnesses ---

    # ------------------------------------------------- other harnesses ---

    - name: Look for other installed harnesses
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/{{ item }}"
      loop: "{{ agent_harness_dirs }}"
      register: agent_harness_stat

    # One file per harness, because each reads only its own path. Contents match
    # what the rules directory gives Claude, minus the host-local personal
    # context: that file lives on the target and the control node cannot read it.
    - name: Deploy the profile to each installed harness's global file
      ansible.builtin.copy:
        content: |
          {{ lookup('file', playbook_dir + '/profile/SOUL.md') }}

          {{ lookup('file', playbook_dir + '/profile/USER.md') }}

          {{ lookup('file', playbook_dir + '/CLAUDE.md') }}

          {{ lookup('file', agent_overlay_root + '/' + agent_host_key + '/CLAUDE.local.md') }}
        dest: "{{ ansible_env.HOME }}/{{ item.item }}/AGENTS.md"
        mode: "0640"
      loop: "{{ agent_harness_stat.results }}"
      loop_control:
        label: "{{ item.item }}/AGENTS.md"
      when: item.stat.isdir | default(false)

    - name: Deploy the agreement to ~/AGENTS.md for non-Claude harnesses
      ansible.builtin.copy:
        src: CLAUDE.md
        dest: "{{ ansible_env.HOME }}/AGENTS.md"
        mode: "0644"
        follow: false
